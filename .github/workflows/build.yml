name: Build
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Upstream runs on Blacksmith; this fork's org has no such runners, so the job would queue forever.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          ./gradlew build -x lint -x test
          cd sample/android/build/outputs/apk/debug
          mv android-debug.apk android-sample-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-sample-debug
          path: sample/android/build/outputs/apk/debug/android-sample-debug.apk
