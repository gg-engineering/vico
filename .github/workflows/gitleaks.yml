name: gitleaks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # HEAD only: older feature/version branches carry a token in history that is tracked separately.
          ./gitleaks git --redact -v --exit-code 1 --log-opts="HEAD"
